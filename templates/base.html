<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f2">
  <title>{% block title %}Career Compass{% endblock %} | AI Career Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}" aria-label="Career Compass home"><span class="brand-mark">cc</span><span>career<span class="brand-light">compass</span></span></a>
    <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span></button>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="{{ url_for('career_page') }}">Career guide</a>
      <a href="{{ url_for('resume_page') }}">Resume lab</a>
      <a href="{{ url_for('dashboard_page') }}">My dashboard</a>
      <a href="{{ url_for('interview_page') }}">Interview prep</a>
    </nav>
    <a class="header-cta" href="{{ url_for('career_page') }}">Start planning <span aria-hidden="true">↗</span></a>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer"><a class="brand footer-brand" href="{{ url_for('home') }}"><span class="brand-mark">cc</span><span>career<span class="brand-light">compass</span></span></a><p>From Resume → Skill Gap → Skill Proof → Career Ready</p><span class="footer-note">A learning companion, not a hiring guarantee.</span></footer>
  <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</body>
</html>
